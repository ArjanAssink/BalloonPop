<body>
    <div class="stars" id="stars"></div>
    
    <div class="start-screen" id="startScreen">
        <h1>🎈 Ballonnen Plop Quiz 🎈</h1>
        <p>Kies een spelmodus om te oefenen!</p>
        <div class="game-mode-buttons">
            <button class="start-btn" onclick="startGameWithSet('math')">🔢 Oefen Rekensommen</button>
            <button class="start-btn" onclick="startGameWithSet('letters')">🔤 Oefen Lettergeluiden</button>

        </div>

            Camera en handherkenning laden<span class="spinner"></span>
        </div>
    </div>
    
    <div id="game-container" style="display: none;">
        <video id="videoPreview" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        
        <div class="ui-overlay">
            <div class="question-box" id="questionBox"></div>
            <div class="score-display">Score: <span id="score">0</span></div>
        </div>
        
        <div id="balloonsContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none;"></div>
        <div class="hand-cursor" id="handCursor" style="display: none;"></div>
    </div>
